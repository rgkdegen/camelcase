[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "camelcase-humpy"
version = "0.2.0"
description = "A camel who walks your repo at night: buried TODOs, dropped keys, snake_case, missing basics and open issues."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "rgkdegen" }]
keywords = ["github", "cli", "todo", "secrets", "camelcase", "code-quality", "github-actions"]
dependencies = []

[project.urls]
Homepage = "https://github.com/rgkdegen/camelcase"

[project.scripts]
humpy = "camelcase.cli:main"

[tool.setuptools]
packages = ["camelcase"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
